<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendidikan - Pondok Pesantren Babussalam</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-image: url('https://www.transparenttextures.com/patterns/islamic-art.png');
        }

        .page-header {
            margin-top: 80px;
            background: linear-gradient(135deg, #0a1929 0%, #1e3a5f 100%);
            padding: 4rem 5%;
            text-align: center;
            color: white;
        }

        .page-header h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .education-content {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 5%;
        }

        .education-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            border-top: 5px solid #ffd700;
        }

        .education-card h3 {
            color: #0a1929;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 1rem;
        }

        .education-card h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: #ffd700;
        }

        .education-card h4 {
            color: #1e3a5f;
            font-size: 1.3rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .education-card p {
            color: #555;
            line-height: 1.9;
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        .education-card ul {
            list-style: none;
            padding-left: 0;
        }

        .education-card ul li {
            color: #555;
            padding: 0.8rem 0;
            padding-left: 2rem;
            position: relative;
            line-height: 1.7;
        }

        .education-card ul li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .highlight-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 237, 78, 0.1) 100%);
            border-left: 4px solid #ffd700;
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
        }

        .highlight-box p {
            margin: 0;
            color: #0a1929;
            font-weight: 500;
        }
    </style>
</head>
<body>
<body class="page-pendidikan"></body>
