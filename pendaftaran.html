<section class="pendaftaran-section py-5">
    <div class="container">
        <div class="form-card p-4 shadow rounded">

            <div class="text-center mb-4">
                <div class="logo-icon mx-auto mb-2 fs-1">🕌</div>
                <h2>Pendaftaran Santri Baru</h2>
                <p class="text-muted">Pondok Pesantren Babussalam - Tahun Ajaran 2025/2026</p>
            </div>
             <form action="php/proses_daftar.php" method="POST">

                <!-- DATA PRIBADI -->
                <h5 class="mb-3 text-primary">📋 Data Pribadi</h5>

                <div class="mb-3">
                    <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                    <input type="text" name="nama_lengkap" class="form-control" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">NIK <span class="text-danger">*</span></label>
                    <input type="text" name="nik" class="form-control" placeholder="16 digit NIK" maxlength="16" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tempat Lahir <span class="text-danger">*</span></label>
                        <input type="text" name="tempat_lahir" class="form-control" placeholder="Kota/Kabupaten" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tanggal Lahir <span class="text-danger">*</span></label>
                        <input type="date" name="tanggal_lahir" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>
                    <select name="jenis_kelamin" class="form-select" required>
                        <option value="">-- Pilih Jenis Kelamin --</option>
                        <option value="L">Laki-laki</option>
                        <option value="P">Perempuan</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Alamat Lengkap <span class="text-danger">*</span></label>
                    <textarea name="alamat" class="form-control" rows="3" placeholder="Alamat lengkap sesuai KTP" required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">No HP/WhatsApp <span class="text-danger">*</span></label>
                        <input type="tel" name="no_hp" class="form-control" placeholder="08xxxxxxxxxx" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="email@contoh.com">
                    </div>
                </div>

                <hr class="my-4">
    
</body>
